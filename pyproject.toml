[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ruler-unlearning"
version = "3.0.0"
description = "Four metrics for representation-level verification of machine unlearning"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Georgina Cosma" },
    { name = "Axel Finke" },
]
keywords = ["machine unlearning", "verification", "representation learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The verification core needs nothing but numpy, so RULER can be used from a
# JAX, TensorFlow or scikit-learn project without pulling in PyTorch.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Everything needed to reproduce the paper's experiments (the `paper` package).
paper = [
    "torch>=2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
]
clinical = ["transformers>=4.30"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["ruler"]   # `paper` is experiment code, not part of the distribution

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
