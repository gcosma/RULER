[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ruler-unlearning"
version = "1.0.0"
description = "Four representation-level metrics for verifying machine unlearning"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Georgina Cosma" },
    { name = "Axel Finke" },
]
keywords = ["machine unlearning", "verification", "representation learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The library itself needs nothing but numpy. These are for running the test
# suite and the tutorial (which trains a small PyTorch model on a
# scikit-learn dataset).
dev = [
    "pytest>=7.0",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "nbconvert>=7.0",
    "nbformat>=5.0",
    "ipykernel>=6.0",
]

[project.urls]
Repository = "https://github.com/gcosma/RULER"

[tool.setuptools]
packages = ["ruler"]
